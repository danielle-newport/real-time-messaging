<!DOCTYPE html>
<html>

<head>
    <title>Chat App</title>
    <style>
        body {
            margin: 0;
            padding-bottom: 3rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #form {
            background: rgba(0, 0, 0, 0.15);
            padding: 0.25rem;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            height: 3rem;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        #input {
            border: none;
            padding: 0 1rem;
            flex-grow: 1;
            border-radius: 2rem;
            margin: 0.25rem;
        }

        #input:focus {
            outline: none;
        }

        #form>button {
            background: #333;
            border: none;
            padding: 0 1rem;
            margin: 0.25rem;
            border-radius: 3px;
            outline: none;
            color: #fff;
        }

        #messages {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        #messages>li {
            padding: 0.5rem 1rem;
        }

        #messages>li:nth-child(odd) {
            background: #efefef;
        }
    </style>
</head>

<body>
    <ul id="messages"></ul>
    <form id="form" action="">
        <input id="input" name="messageInput" type="text" placeholder="Type a message" /><button>Send</button>
    </form>
    <!-- <button onclick="sendMessage()">Send</button> -->

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io(); // Connect to server

        var form = document.getElementById('form');
        var input = document.getElementById('input');
        var messages = document.getElementById('messages');

        // Load past messages (via REST API)
        fetch("http://localhost:3000/api/messages")
            .then(res => res.json())
            .then(loadedMessage => {
                console.log(loadedMessage);
                addMessage(loadedMessage.message);
            });

        // Listen for new messages (Socket.io)
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            // Get form data
            const formData = new FormData(e.currentTarget);
            const messageInput = formData.get('messageInput');

            console.log(messageInput)
            if (messageInput) {
                console.log("message not null", socket);
                socket.emit('new_message', messageInput);
                input.value = '';
            }
        });
        socket.on("new_message", (msg) => {
            console.log("new_message event");
            addMessage(msg);
        });

        function addMessage(msg) {
            var item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
</body>

</html>
