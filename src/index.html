<!DOCTYPE html>
<html>

<head>
    <title>Chat App</title>
</head>

<body>
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="Type a message">
    <button onclick="sendMessage()">Send</button>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io("http://localhost:3000"); // Connect to server

        // Load past messages (via REST API)
        fetch("http://localhost:3000/api/messages")
            .then(res => res.json())
            .then(messages => {
                messages.forEach(msg => addMessage(msg));
            });

        // Listen for new messages (Socket.io)
        socket.on("new_message", (msg) => {
            addMessage(msg);
        });

        function sendMessage() {
            const input = document.getElementById("messageInput");
            const message = { user: "Guest", text: input.value };
            socket.emit("send_message", message); // Send via Socket.io
            input.value = "";
        }

        function addMessage(msg) {
            const div = document.createElement("div");
            div.textContent = `${msg.user}: ${msg.text}`;
            document.getElementById("messages").appendChild(div);
        }
    </script>
</body>

</html>
